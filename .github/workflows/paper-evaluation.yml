name: paper-evaluation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "paper/**"
      - "crates/medscale-contracts/tests/paper_*.rs"
      - "crates/medscale-core/tests/paper_*.rs"
      - ".github/workflows/paper-evaluation.yml"

permissions:
  contents: read

concurrency:
  group: paper-evaluation-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  paper-conformance:
    name: paper conformance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v4
        with:
          # Pull-request workflows otherwise test GitHub's synthetic merge ref.
          # The paper requires evidence bound to the exact research head revision.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: "1.97.1"

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - name: Install Perl (Windows OpenSSL vendor build)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install strawberryperl -y --no-progress
          echo "C:\Strawberry\perl\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install OpenSSL/Perl (macOS SQLCipher vendor build)
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3 perl
          echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          echo "$(brew --prefix perl)/bin" >> "$GITHUB_PATH"

      - name: Capture environment manifest
        run: python paper/artifact/scripts/evidence_io.py manifest

      - name: Experiment A0 — contract provenance controls
        if: always()
        run: >-
          python paper/artifact/scripts/evidence_io.py run --label a0 --
          cargo test -p medscale-contracts --test paper_provenance_contracts --locked -- --nocapture

      - name: Experiment A1 — Core provenance binding
        if: always()
        run: >-
          python paper/artifact/scripts/evidence_io.py run --label a1 --
          cargo test -p medscale-core --test paper_provenance_system --locked -- --nocapture

      - name: Experiment B0 — authority/effect conformance
        if: always()
        run: >-
          python paper/artifact/scripts/evidence_io.py run --label b0 --
          cargo test -p medscale-core --test paper_authority_effects --locked -- --nocapture

      - name: Hash raw evidence
        if: always()
        run: python paper/artifact/scripts/evidence_io.py hash

      - name: Upload paper evaluation evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v4.6.2
        with:
          name: medscale-paper-evaluation-${{ matrix.os }}
          path: paper/artifact/raw/ci/
          if-no-files-found: error
