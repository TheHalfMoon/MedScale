[package]
name = "medscale-desktop-tauri"
version = "0.1.0"
description = "MedScale Desktop (Tauri): Rust-owned Core sessions behind named commands"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
publish = false
build = "build.rs"

[workspace]

[features]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
medscale-contracts = { path = "../../../crates/medscale-contracts" }
medscale-core = { path = "../../../crates/medscale-core" }
medscale-desktop-vm = { path = "../../../crates/medscale-desktop-vm" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "=2.12.0", default-features = false, features = ["wry", "compression", "common-controls-v6", "x11"] }

[build-dependencies]
tauri-build = { version = "=2.7.0" }

[dev-dependencies]
tauri = { version = "=2.12.0", default-features = false, features = ["test"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "allow", priority = -1 }
