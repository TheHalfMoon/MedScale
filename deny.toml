# cargo-deny 0.20+ configuration for MedScale Spec 001.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
unmaintained = "workspace"
unsound = "all"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
    "LicenseRef-Slint-Royalty-free-2.0",
]
unused-allowed-license = "allow"

exceptions = [
    { crate = "clipboard-win@5.4.1", allow = ["BSL-1.0"] },
    { crate = "error-code@3.4.0", allow = ["BSL-1.0"] },
    { crate = "libfuzzer-sys@0.4.13", allow = ["NCSA"] },
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
