[workspace]
resolver = "2"
members = [
    "crates/medscale-contracts",
    "crates/medscale-core",
    "crates/medscale-cli",
    "crates/medscale-storage",
    "crates/medscale-fhir",
    "crates/medscale-keys",
    "crates/medscale-desktop",
    "crates/medscale-network",
    "crates/medscale-pack",
]
default-members = [
    "crates/medscale-contracts",
    "crates/medscale-core",
    "crates/medscale-cli",
    "crates/medscale-storage",
    "crates/medscale-fhir",
    "crates/medscale-keys",
    "crates/medscale-desktop",
    "crates/medscale-network",
    "crates/medscale-pack",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.20"
rusqlite = { version = "0.37.0", features = ["bundled-sqlcipher-vendored-openssl"] }
aes-gcm = "0.10.3"
argon2 = "0.5.3"
zeroize = { version = "1.8.1", features = ["derive"] }
rand = "0.8.5"
clap = { version = "4.5.53", features = ["derive"] }
anyhow = "1.0.100"
interprocess = "2.4.4"
ureq = { version = "3.0.12", default-features = false, features = ["rustls", "json"] }
ed25519-dalek = { version = "2.2.0", features = ["std"] }
# Spec 028: OS credential stores; no default features (keyring 3.x requires explicit platforms).
# keyring 4.x needs rustc >= 1.88; workspace rust-version is 1.85 → pin 3.6.3.
keyring = { version = "3.6.3", default-features = false, features = [
    "windows-native",
    "apple-native",
    "linux-native",
] }
medscale-contracts = { path = "crates/medscale-contracts", version = "0.1.0" }
medscale-storage = { path = "crates/medscale-storage", version = "0.1.0" }
medscale-fhir = { path = "crates/medscale-fhir", version = "0.1.0" }
medscale-core = { path = "crates/medscale-core", version = "0.1.0" }
medscale-keys = { path = "crates/medscale-keys", version = "0.1.0" }
medscale-network = { path = "crates/medscale-network", version = "0.1.0" }
medscale-pack = { path = "crates/medscale-pack", version = "0.1.0" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "allow", priority = -1 }
